name: Flutter package and lifecycle contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owls-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASED_INTERFACES_REF: 291406191b55606e34b7980b42112e9c77ab690b
  CURRENT_INTERFACES_REF: ff6d5ba6ea8da130854eb511994eb0547ff44988
  TSJSV_REF: 03ccc0ecdfc70f9198c3ccf80718910961d3fde1

jobs:
  contract-admission:
    name: TypeSpec and JSON Schema Contract IR admission
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Flutter host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out exact current interface authority pair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ores-wasm-loaders/owls-interfaces
          ref: ${{ env.CURRENT_INTERFACES_REF }}
          path: subject/owls-interfaces
          persist-credentials: false
      - name: Check out exact TypeSpec and JSON Schema validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TSJSV_REF }}
          path: subject/owls-interfaces/.tools/typespec-json-schema-validator
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install the validator's lockfile-pinned toolchain
        working-directory: subject/owls-interfaces/.tools/typespec-json-schema-validator
        run: npm ci --omit=dev
      - name: Verify exact source closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C subject/owls-interfaces rev-parse HEAD)" = "$CURRENT_INTERFACES_REF"
          test "$(git -C subject/owls-interfaces/.tools/typespec-json-schema-validator rev-parse HEAD)" = "$TSJSV_REF"
          case "$CURRENT_INTERFACES_REF:$TSJSV_REF" in
            *[!0-9a-f:]*|*:|:*) exit 1 ;;
          esac
          test "${#CURRENT_INTERFACES_REF}" -eq 40
          test "${#TSJSV_REF}" -eq 40
      - name: Stage admitted release fixtures as independent TJSV corpus
        shell: bash
        run: |
          set -euo pipefail
          corpus=subject/owls-interfaces/.typespec-json-schema-validator/instances/Release/valid
          mkdir -p "$corpus"
          cp subject/owls-interfaces/fixtures/valid/*.json "$corpus"/
          count="$(find "$corpus" -maxdepth 1 -type f -name '*.json' | wc -l)"
          test "$count" -ge 4
      - name: Generate Schema B, compare peer authorities, and emit Contract IR
        working-directory: subject/owls-interfaces
        shell: bash
        run: |
          set -euo pipefail
          node .tools/typespec-json-schema-validator/bin/typespec-json-schema-validator.mjs check \
            --typespec=contracts/main.tsp \
            --schema=schemas/release.schema.json \
            --instances=.typespec-json-schema-validator/instances \
            --report=.typespec-json-schema-validator/report.json \
            --contract-ir=.typespec-json-schema-validator/contract-ir.json \
            --output-dir=.typespec-json-schema-validator/generated \
            --max-probes=96 \
            --quiet
      - name: Canonically verify current peer authorities and complete Flutter consumer scope
        uses: ORESoftware/typespec-json-schema-validator/actions/verify-contract-ir@03ccc0ecdfc70f9198c3ccf80718910961d3fde1
        with:
          contract_ir: subject/owls-interfaces/.typespec-json-schema-validator/contract-ir.json
          report: subject/owls-interfaces/.typespec-json-schema-validator/report.json
          typespec: subject/owls-interfaces/contracts/main.tsp
          schema: subject/owls-interfaces/schemas/release.schema.json
          generated_schema: subject/owls-interfaces/.typespec-json-schema-validator/generated/typespec.generated.schema.json
          expected_declarations: >-
            [
              "Ores.WasmLoaders.Activation",
              "Ores.WasmLoaders.ActivationMode",
              "Ores.WasmLoaders.ApplicationId",
              "Ores.WasmLoaders.Asset",
              "Ores.WasmLoaders.AssetId",
              "Ores.WasmLoaders.AssetKind",
              "Ores.WasmLoaders.AssetRole",
              "Ores.WasmLoaders.AssetStage",
              "Ores.WasmLoaders.EntrypointId",
              "Ores.WasmLoaders.FrameworkKind",
              "Ores.WasmLoaders.HostSelector",
              "Ores.WasmLoaders.HttpsAssetUrl",
              "Ores.WasmLoaders.IslandName",
              "Ores.WasmLoaders.PrepareBudget",
              "Ores.WasmLoaders.PrepareStage",
              "Ores.WasmLoaders.RecordString",
              "Ores.WasmLoaders.RecordUnknown",
              "Ores.WasmLoaders.Release",
              "Ores.WasmLoaders.ReleaseId",
              "Ores.WasmLoaders.RuntimeKind",
              "Ores.WasmLoaders.SchemaVersion",
              "Ores.WasmLoaders.Sha256Hex",
              "Ores.WasmLoaders.ToolchainId"
            ]
          verification: subject/owls-interfaces/.typespec-json-schema-validator/tjsv-consumer-verification.json
      - name: Independently verify the receipt, source digests, Contract IR, and language projections
        working-directory: subject/owls-interfaces
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-contract-ir.mjs
          node scripts/check-language-projections.mjs
      - name: Record the Flutter boundary evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence=subject/owls-interfaces/.typespec-json-schema-validator
          {
            printf 'flutter_host=%s\n' "$(git rev-parse HEAD)"
            printf 'interfaces=%s\n' "$CURRENT_INTERFACES_REF"
            printf 'validator=%s\n' "$TSJSV_REF"
            printf 'node=%s\n' "$(node --version)"
          } > "$evidence/flutter-boundary-versions.txt"
          sha256sum \
            "$evidence/report.json" \
            "$evidence/contract-ir.json" \
            "$evidence/tjsv-consumer-verification.json" \
            "$evidence/projection-receipt.json" \
            > "$evidence/flutter-boundary-sha256.txt"
      - name: Preserve exact contract-admission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-contract-admission-${{ github.sha }}
          path: subject/owls-interfaces/.typespec-json-schema-validator/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

  package:
    name: locked release package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the exact interface lock dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ores-wasm-loaders/owls-interfaces
          ref: ${{ env.RELEASED_INTERFACES_REF }}
          path: zed_modules/ores-wasm-loaders/owls-interfaces
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true
      - name: Verify package and lock provenance
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'name: owls_flutter' pubspec.yaml
          grep -F 'version: 0.1.1' pubspec.yaml
          grep -F 'name = "owls-interfaces"' .zpkg.lock
          grep -F 'version = "0.1.1"' .zpkg.lock
          grep -F "vcs_commit = \"$RELEASED_INTERFACES_REF\"" .zpkg.lock
          test -f zed_modules/ores-wasm-loaders/owls-interfaces/dart/pubspec.yaml
      - name: Resolve the immutable Dart graph
        run: flutter pub get --enforce-lockfile
      - name: Format and reject committed source drift
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test tool
          git diff --exit-code -- lib test tool
      - name: Analyze
        run: flutter analyze
      - name: Test preparation, activation, cleanup, MIME, URL, and bridge contracts
        run: flutter test --reporter expanded

  current-interface-compatibility:
    name: current Schema A and Dart projection compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the current parity-admitted interface head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ores-wasm-loaders/owls-interfaces
          ref: ${{ env.CURRENT_INTERFACES_REF }}
          path: zed_modules/ores-wasm-loaders/owls-interfaces
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true
      - name: Verify exact compatibility source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zed_modules/ores-wasm-loaders/owls-interfaces rev-parse HEAD)" = "$CURRENT_INTERFACES_REF"
          grep -F 'name: owls_interfaces' zed_modules/ores-wasm-loaders/owls-interfaces/dart/pubspec.yaml
          grep -F 'version: 0.1.1' zed_modules/ores-wasm-loaders/owls-interfaces/dart/pubspec.yaml
          test -f zed_modules/ores-wasm-loaders/owls-interfaces/dart/lib/json.dart
      - name: Resolve without mutating the committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.lock "$RUNNER_TEMP/pubspec.lock"
          flutter pub get --enforce-lockfile
          cmp pubspec.lock "$RUNNER_TEMP/pubspec.lock"
      - name: Format under the resolved package language version
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test tool
          git diff --exit-code -- lib test tool
      - name: Materialize exact current Schema A into the canary build
        shell: bash
        run: |
          set -euo pipefail
          schema=zed_modules/ores-wasm-loaders/owls-interfaces/schemas/release.schema.json
          test -s "$schema"
          {
            printf '%s\n' '// Generated only for this exact-revision compatibility canary.'
            printf "const releaseSchemaJson = r'''"
            cat "$schema"
            printf "''';\n"
          } > lib/src/release_schema.dart
          grep -F 'release-v2.json' lib/src/release_schema.dart
      - name: Compile and test the Flutter host against current Schema A and Dart projection
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze
          flutter test --reporter expanded
          dart run tool/current_interface_check.dart
      - name: Record immutable compatibility evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            printf 'flutter_host=%s\n' "$(git rev-parse HEAD)"
            printf 'interfaces=%s\n' "$(git -C zed_modules/ores-wasm-loaders/owls-interfaces rev-parse HEAD)"
            printf 'schema_a_sha256=%s\n' "$(sha256sum zed_modules/ores-wasm-loaders/owls-interfaces/schemas/release.schema.json | cut -d' ' -f1)"
            printf 'flutter=%s\n' "$(flutter --version --machine | tr -d '\n')"
          } > evidence/current-interface-compatibility.txt
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-current-interface-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
